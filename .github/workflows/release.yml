name: sokuim server auto-release

on:
  push:
    branches:
      - main
      - master
    paths: # paths中的代码发生变化时，触发 action
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
      - "pkg/**"
      - "app/comet/**" # comet下所有文件修改均触发
      - "app/core/**" # core下所有文件修改均触发
      - "app/gateway/**" # gateway下所有文件修改均触发
      - "app/job/**" # gateway下所有文件修改均触发

jobs:
  check-changes:
    runs-on: ubuntu-latest # runner 运行环境
    outputs:
      comet: ${{ steps.filter.outputs.comet }} # comet服务需要监控的文件
      core: ${{ steps.filter.outputs.core }} # core服务需要监控的文件
      gateway: ${{ steps.filter.outputs.gateway }} # gateway服务需要监控的文件
      job: ${{ steps.filter.outputs.job }} # job服务需要监控的文件
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #拉取git的所有历史记录，包含分支、comet、tag, 1时只拉取最近一次

      - name: Get change files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            comet:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'app/comet/**'
              - '.github/workflows/release.yml'
            core:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'app/core/**'
              - '.github/workflows/release.yml'
            gateway:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'app/gateway/**'
              - '.github/workflows/release.yml'
            job:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'app/job/**'
              - '.github/workflows/release.yml'

      - name: debug output
        run: |
          echo "release comet: ${{ steps.filter.outputs.comet }}"
          echo "release core: ${{ steps.filter.outputs.core }}"
          echo "release gateway: ${{ steps.filter.outputs.gateway }}"
          echo "release job: ${{ steps.filter.outputs.job }}"
          echo "current branch: ${{ github.ref_name }}"

  # 发布: prod
  release-prod:
    needs: check-changes
    if: |
      (github.ref_name == 'master' || github.ref_name == 'main') &&
      (needs.check-changes.outputs.comet == 'true' ||
       needs.check-changes.outputs.core == 'true' ||
       needs.check-changes.outputs.gateway == 'true' ||
       needs.check-changes.outputs.job == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy: # 矩阵, 所有服务以及对应的检测输出
      fail-fast: false # 单个服务构建失败不影响其他服务
      matrix:
        include:
          - service: comet
            port: ${{ vars.PORT_COMET || 8082 }}
            dockerfile: ./app/comet/Dockerfile
            host_var: RELEASE_HOST_COMET
            path_var: RELEASE_PATH_COMET
            user_var: RELEASE_USER_COMET
            secret_var: RELEASE_SSH_COMET
            changed: ${{ needs.check-changes.outputs.comet }}
          - service: core
            port: 6071
            dockerfile: ./app/core/Dockerfile
            host_var: RELEASE_HOST_CORE
            path_var: RELEASE_PATH_CORE
            user_var: RELEASE_USER_CORE
            secret_var: RELEASE_SSH_CORE
            changed: ${{ needs.check-changes.outputs.core }}
          - service: gateway
            port: ${{ vars.PORT_GATEWAY || 8080 }}
            dockerfile: ./app/gateway/Dockerfile
            host_var: RELEASE_HOST_GATEWAY
            path_var: RELEASE_PATH_GATEWAY
            user_var: RELEASE_USER_GATEWAY
            secret_var: RELEASE_SSH_GATEWAY
            changed: ${{ needs.check-changes.outputs.gateway }}
          - service: job
            port: ${{ vars.PORT_JOB || 8081 }}
            dockerfile: ./app/job/Dockerfile
            host_var: RELEASE_HOST_JOB
            path_var: RELEASE_PATH_JOB
            user_var: RELEASE_USER_JOB
            secret_var: RELEASE_SSH_JOB
            changed: ${{ needs.check-changes.outputs.job }}
    steps:
      # 仅对改变的服务拉取镜像
      - name: Checkout code
        if: ${{ matrix.changed == 'true' }}
        uses: actions/checkout@v4

      # 提取环境变量(小写仓库路径与 commit sha)
      - name: Set environment variables
        if: ${{ matrix.changed == 'true' }}
        run: |
          RAW_REPO=${{ github.repository }}
          echo "IMAGE_BASE=ghcr.io/${RAW_REPO,,}/${{ matrix.service }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA:~0,7}" >> $GITHUB_ENV

      # 初始化 Docker buildx
      - name: Set up Docker buildx
        if: ${{ matrix.changed == 'true' }}
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub
      - name: Login to GHCR
        if: ${{ matrix.changed == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送镜像
      - name: Build and push docker image
        if: ${{ matrix.changed == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mod=max
      - name: release to prod
        if: ${{ matrix.changed == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars[matrix.host_var] }}
          username: ${{ vars[matrix.user_var] }}
          key: ${{ secrets[matrix.secret_var] }}
          script: |
            set -e # 出错时停止运行脚本
            
            SERVICE="${{ matrix.service }}"
            RAW_REPO="${{ github.repository }}"
            # 动态读取对应服务在服务器上的存放目录
            WORK_DIR="${{ vars[matrix.path_var] || '/workspace/docker/sokuim-server' }}"
            COMPOSE_FILE="docker-compose.${SERVICE}.yml"
            
            echo "=========================================="
            echo "Deploying Service: $SERVICE"
            echo "Target Image: $IMAGE:latest"
            echo "Work Directory: $WORK_DIR"
            echo "Compose File: $COMPOSE_FILE"
            echo "=========================================="
            
            # 检查、创建工作目录
            if [ ! -d "$WORK_DIR" ]; then
              echo "Release path is not exist. create: $WORK_DIR"
              sudo mkdir -p "$WORK_DIR"
              sudo chown -R $USER:$USER "$WORK_DIR"
              echo "Release path created successful!"
            else
              echo "Release path exists: $WORK_DIR"
            fi
            cd "$WORK_DIR"
            
            # 登录GitHub 镜像仓库
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 下载 docker-compose 文件
            echo "Downloading docker-compose file for $SERVICE from GitHub..."
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/app/${SERVICE}/docker-compose.yml" \
              -o "$COMPOSE_FILE"
            
            # 下载检查与校验
            if [ ! -f "$COMPOSE_FILE"] || [ ! -s "$COMPOSE_FILE"]; then
              echo "Error: Download app/${SERVICE}/docker-compose.yml failed or file is empty!"
              exit 1
            fi

            # 替换端口变量
            GATEWAY_PORT="${{ vars.PORT_GATEWAY || 8080 }}"
            sed -i "s/\${GATEWAY_PORT}/${GATEWAY_PORT}/g" "$COMPOSE_FILE"
            
            JOB_PORT="${{ vars.PORT_JOB || 8081 }}"
            sed -i "s/\${JOB_PORT}/${JOB_PORT}/g" "$COMPOSE_FILE"
            
            COMET_PORT="${{ vars.PORT_COMET || 8082 }}"
            sed -i "s/\${COMET_PORT}/${COMET_PORT}/g" "$COMPOSE_FILE"

            echo "Content of $COMPOSE_FILE:"
            cat "$COMPOSE_FILE"
            
            # 拉取镜像并部署
            echo "Pulling latest image for $SERVICE..."
            docker compose -f "$COMPOSE_FILE" pull
            
            # 清理残留的非 compose 管理的同名旧容器
            docker rm -f "sokuim-$SERVICE" 2>/dev/null || true

            # 清理占用目标端口的容器
            PORT="${{ matrix.port }}"
            docker ps -a --filter "publish=$PORT" -q | xargs -r docker rm -f 2>/dev/null || true

            echo "Restart $SERVICE..."
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
            
            # 清理旧镜像
            docker image prune -f
            
            echo "Deployment for $SERVICE completed successful!"