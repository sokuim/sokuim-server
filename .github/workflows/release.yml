name: sokuim server auto-release

on:
  push:
    branches:
      - main
      - master
    paths: # paths中的代码发生变化时，触发 action
      - "main.go"
      - "go.mod"
      - ".github/workflows/release.yml"
      - "app/comet/**" # comet下所有文件修改均触发
      - "app/core/**" # core下所有文件修改均触发
      - "app/gateway/**" # gateway下所有文件修改均触发

jobs:
  check-changes:
    runs-on: ubuntu-latest # runner 运行环境
    outputs:
      comet: ${{ steps.filter.outputs.comet }} # comet服务需要监控的文件
      core: ${{ steps.filter.outputs.core }} # core服务需要监控的文件
      gateway: ${{ steps.filter.outputs.gateway }} # gateway服务需要监控的文件
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #拉取git的所有历史记录，包含分支、comet、tag, 1时只拉取最近一次

      - name: Get change files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            comet:
              - 'go.mod'
              - 'app/comet/**'
              - '.github/workflows/release.yml'
            core:
              - 'go.mod'
              - 'app/core/**'
              - '.github/workflows/release.yml'
            gateway:
              - 'go.mod'
              - 'app/gateway/**'
              - '.github/workflows/release.yml'

      - name: debug output
        run: |
          echo "release comet: ${{ steps.filter.outputs.comet }}"
          echo "release core: ${{ steps.filter.outputs.core }}"
          echo "release gateway: ${{ steps.filter.outputs.gateway }}"
          echo "current branch: ${{ github.ref_name }}"

  # 发布: prod
  release-prod:
    needs: check-changes
    if: |
      (github.ref_name == 'master' || github.ref_name == 'main') &&
      (needs.check-changes.outputs.comet == 'true' ||
       needs.check-changes.outputs.core == 'true' ||
       needs.check-changes.outputs.gateway == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy: # 矩阵, 所有服务以及对应的检测输出
      fail-fast: true # 单个服务构建失败不影响其他服务
      matrix:
        include:
          - service: comet
            dockerfile: ./app/comet/Dockerfile
            changed: ${{ needs.check-changes.outputs.comet }}
          - service: core
            dockerfile: ./app/core/Dockerfile
            changed: ${{ needs.check-changes.outputs.core }}
          - service: gateway
            dockerfile: ./app/gateway/Dockerfile
            changed: ${{ needs.check-changes.outputs.gateway }}
    steps:
      # 仅对改变的服务拉取镜像
      - name: Checkout code
        if: ${{ matrix.changed == 'true' }}
        uses: actions/checkout@v4

      # 提取环境变量(小写仓库路径与 comet sha)
      - name: Set environment variables
        if: ${{ matrix.changed == 'true' }}
        run: |
          RAW_REPO=${{ github.repository }}
          echo "IMAGE_BASE=ghcr.io/${RAW_REPO,,}/${{ matrix.service }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA:~0,7}" >> $GITHUB_ENV

      # 初始化 Docker buildx
      - name: Set up Docker buildx
        if: ${{ matrix.changed == 'true' }}
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub
      - name: Login to GHCR
        if: ${{ matrix.changed == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送镜像
      - name: Build and push docker image
        if: ${{ matrix.changed == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:{{ env.GITHUB_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mod=max