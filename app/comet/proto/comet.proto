syntax = "proto3";

package pb;
option go_package = "./pb";

message CometMsgProto {
  int32 op = 1;
  bytes body = 2;
}

message CometPushCommonReq {
  int32 op = 1;
  bytes body = 2;
}

message CometPushCommonResp {}

message CometBroadcastRoomReq {
  string roomID = 1;
  CometMsgProto proto = 2;
}

message CometBroadcastRoomResp {}

service Comet {
  rpc PushMsgCommon (CometPushCommonReq) returns (CometPushCommonResp);
}