version: '3'

networks:
  app-tier:
    driver: bridge

services:
  etcd:
    image: "bitnamilegacy/etcd:3.6.4"
    container_name: "etcd"
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - CLIENT_ADDR=etcd
      - ETCD_ROOT_PASSWORD=admin
    networks:
      - app-tier
    restart: always